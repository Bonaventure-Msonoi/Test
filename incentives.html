<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investment Incentives — IZIC 2026</title>
    <link rel="icon" href="https://zda.org.zm/izic/wp-content/uploads/2026/01/cropped-IZIC-Event-Logo-files-01-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="incentives">
    <div data-site-header></div>
    <main id="main">
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">Invest in Zambia</p>
          <h1>Investment incentives</h1>
          <p>Flip a card for fiscal or non-fiscal benefits.</p>
        </div>
      </section>
      <section class="section">
        <div class="wrap flip-grid flip-grid-two">
          <button type="button" class="flip-card" data-flip-card aria-pressed="false">
            <div class="flip-card-inner">
              <div class="flip-card-face flip-card-front">
                <span class="story-card-sector">Fiscal</span>
                <h2>Fiscal incentives</h2>
                <p>From US$500,000 qualifying investment</p>
                <span class="flip-hint">Tap to flip</span>
              </div>
              <div class="flip-card-face flip-card-back">
                <h3>What’s included</h3>
                <ul>
                  <li>Accelerated depreciation on capital equipment and machinery for five years</li>
                  <li>0% import duty on capital equipment and machinery for five years</li>
                  <li>Applies in MFEZ, Industrial Park, priority sector, or rural enterprise</li>
                </ul>
              </div>
            </div>
          </button>
          <button type="button" class="flip-card" data-flip-card aria-pressed="false">
            <div class="flip-card-inner">
              <div class="flip-card-face flip-card-front">
                <span class="story-card-sector">Non-fiscal</span>
                <h2>Non-fiscal incentives</h2>
                <p>From US$250,000 qualifying investment</p>
                <span class="flip-hint">Tap to flip</span>
              </div>
              <div class="flip-card-face flip-card-back">
                <h3>What’s included</h3>
                <ul>
                  <li>Investment guarantees and protection against state nationalisation</li>
                  <li>Free facilitation for immigration permits and secondary licences</li>
                  <li>Support with land acquisition and utilities</li>
                </ul>
              </div>
            </div>
          </button>
        </div>
        <div class="wrap cta-row">
          <a class="btn btn-primary" href="business.html">How to register a business</a>
          <a class="btn btn-secondary" href="contact.html">Talk to ZDA / IZIC</a>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="shared.js"></script>
    <script src="main.js"></script>
    <script src="cards.js"></script>
  </body>
</html>
