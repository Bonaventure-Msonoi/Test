<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partnership — IZIC 2026</title>
    <link rel="icon" href="https://zda.org.zm/izic/wp-content/uploads/2026/01/cropped-IZIC-Event-Logo-files-01-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="partnership">
    <div data-site-header></div>
    <main id="main">
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">Partnership</p>
          <h1>Become a sponsor</h1>
          <p>Tap a package to flip and see what’s included.</p>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <div class="flip-grid">
            <button type="button" class="flip-card" data-flip-card aria-pressed="false">
              <div class="flip-card-inner">
                <div class="flip-card-face flip-card-front">
                  <img src="https://zda.org.zm/izic/wp-content/uploads/2026/01/Lead-Sponsor.png" alt="" />
                  <h2>Lead</h2>
                  <p>from ZMW 5M</p>
                  <span class="flip-hint">Tap to flip</span>
                </div>
                <div class="flip-card-face flip-card-back">
                  <h3>Lead package</h3>
                  <ul>
                    <li>Holding room access with the President</li>
                    <li>VVIP speaking slot</li>
                    <li>5 exhibition booths</li>
                    <li>20 Presidential Gala seats</li>
                    <li>Premier branding across the event</li>
                  </ul>
                </div>
              </div>
            </button>

            <button type="button" class="flip-card" data-flip-card aria-pressed="false">
              <div class="flip-card-inner">
                <div class="flip-card-face flip-card-front">
                  <img src="https://zda.org.zm/izic/wp-content/uploads/2026/01/Platinum-Sponsor.png" alt="" />
                  <h2>Platinum</h2>
                  <p>ZMW 3M</p>
                  <span class="flip-hint">Tap to flip</span>
                </div>
                <div class="flip-card-face flip-card-back">
                  <h3>Platinum package</h3>
                  <ul>
                    <li>Holding room access with the President</li>
                    <li>3 exhibition booths</li>
                    <li>10 Presidential Gala seats</li>
                    <li>Side-event hosting opportunity</li>
                    <li>Panel speaking rights</li>
                  </ul>
                </div>
              </div>
            </button>

            <button type="button" class="flip-card" data-flip-card aria-pressed="false">
              <div class="flip-card-inner">
                <div class="flip-card-face flip-card-front">
                  <img src="https://zda.org.zm/izic/wp-content/uploads/2026/01/GOLD-Sponsor.png" alt="" />
                  <h2>Gold</h2>
                  <p>ZMW 1.5M</p>
                  <span class="flip-hint">Tap to flip</span>
                </div>
                <div class="flip-card-face flip-card-back">
                  <h3>Gold package</h3>
                  <ul>
                    <li>VIP lunch access</li>
                    <li>1 exhibition booth</li>
                    <li>7 Presidential Gala seats</li>
                    <li>Logo placement on website</li>
                    <li>Event grounds branding</li>
                  </ul>
                </div>
              </div>
            </button>

            <button type="button" class="flip-card" data-flip-card aria-pressed="false">
              <div class="flip-card-inner">
                <div class="flip-card-face flip-card-front">
                  <img src="https://zda.org.zm/izic/wp-content/uploads/2026/01/SILVER-Sponsor.png" alt="" />
                  <h2>Silver</h2>
                  <p>ZMW 1M</p>
                  <span class="flip-hint">Tap to flip</span>
                </div>
                <div class="flip-card-face flip-card-back">
                  <h3>Silver package</h3>
                  <ul>
                    <li>Priority branding at one key event</li>
                    <li>Exhibition space</li>
                    <li>5 Presidential Gala seats</li>
                    <li>VIP meeting lounge access</li>
                  </ul>
                </div>
              </div>
            </button>

            <button type="button" class="flip-card" data-flip-card aria-pressed="false">
              <div class="flip-card-inner">
                <div class="flip-card-face flip-card-front">
                  <img src="https://zda.org.zm/izic/wp-content/uploads/2026/01/BRONZE-Sponsor.png" alt="" />
                  <h2>Bronze</h2>
                  <p>ZMW 500K</p>
                  <span class="flip-hint">Tap to flip</span>
                </div>
                <div class="flip-card-face flip-card-back">
                  <h3>Bronze package</h3>
                  <ul>
                    <li>Exhibition space</li>
                    <li>3 Presidential Gala seats</li>
                    <li>Website logo placement</li>
                    <li>Event grounds branding</li>
                  </ul>
                </div>
              </div>
            </button>

            <button type="button" class="flip-card" data-flip-card aria-pressed="false">
              <div class="flip-card-inner">
                <div class="flip-card-face flip-card-front">
                  <img src="https://zda.org.zm/izic/wp-content/uploads/2026/01/QUARTZ-Sponsor.png" alt="" />
                  <h2>Quartz</h2>
                  <p>below ZMW 500K</p>
                  <span class="flip-hint">Tap to flip</span>
                </div>
                <div class="flip-card-face flip-card-back">
                  <h3>Quartz package</h3>
                  <ul>
                    <li>Exhibition opportunities</li>
                    <li>2 Presidential Gala seats</li>
                    <li>Website logo placement</li>
                    <li>Event grounds branding</li>
                  </ul>
                </div>
              </div>
            </button>
          </div>

          <div class="cta-row">
            <a class="btn btn-primary" href="mailto:Izic.Sponsorship@zda.org.zm">Email sponsorship team</a>
            <a class="btn btn-secondary" href="register.html">Register interest</a>
          </div>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="shared.js"></script>
    <script src="main.js"></script>
    <script src="cards.js"></script>
  </body>
</html>
